<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JPG 相片預覽平台 - iPad 相容版 (5x3)</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #ffffff;
      --accent-color: #2563eb;
      --hover-color: #1d4ed8;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 12px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* 16:9 主容器 */
    .app-container {
      width: 100%;
      max-width: 1400px;
      aspect-ratio: 16 / 9;
      background-color: #181818;
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    /* 頂部控制列 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 10px 16px;
      border-radius: 8px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    h2 {
      margin: 0;
      font-size: 16px;
      max-width: 65%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn {
      background-color: var(--accent-color);
      color: white;
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: var(--hover-color);
    }

    .btn:disabled {
      background-color: #4b5563;
      cursor: not-allowed;
      opacity: 0.6;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 0;
    }

    /* 5 x 3 網格 */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      height: 100%;
    }

    /* 卡片 */
    .photo-card {
      background-color: var(--card-bg);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
      cursor: pointer;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000000;
      flex: 1;
    }

    .photo-card canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* 檔名標籤 */
    .photo-title {
      padding: 4px 6px;
      font-size: 11px;
      color: var(--text-color);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background-color: #222222;
      border-top: 1px solid #2a2a2a;
      flex-shrink: 0;
    }

    /* 分頁列 */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      padding-top: 6px;
      flex-shrink: 0;
    }

    #pageInfo {
      font-size: 13px;
    }

    /* 燈箱 (Lightbox) */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.92);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .lightbox.active {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-content {
      position: relative;
      max-width: 90vw;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .lightbox-canvas-container canvas {
      max-width: 90vw;
      max-height: 75vh;
      object-fit: contain;
    }

    .lightbox-title {
      margin-top: 10px;
      font-size: 13px;
      color: #e0e0e0;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 14px;
      border-radius: 20px;
    }

    .lightbox-btn {
      position: absolute;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      font-size: 22px;
      padding: 12px 18px;
      cursor: pointer;
      border-radius: 50%;
      user-select: none;
    }

    .lightbox-close { top: 20px; right: 20px; }
    .lightbox-prev { left: 20px; top: 50%; transform: translateY(-50%); }
    .lightbox-next { right: 20px; top: 50%; transform: translateY(-50%); }

    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h2 id="folderTitle">📷 未選擇相片</h2>
      <div>
        <!-- iPad 相容：同時支援選取多檔 (multiple) 與資料夾選取 (webkitdirectory) -->
        <input type="file" id="folderInput" multiple accept="image/jpeg,image/jpg" class="hidden">
        <button class="btn" onclick="document.getElementById('folderInput').click()">📁 選擇相片 / 照片庫</button>
      </div>
    </header>

    <main>
      <div id="photoGrid" class="photo-grid"></div>

      <div class="pagination">
        <button id="prevBtn" class="btn" disabled>上一頁</button>
        <span id="pageInfo">頁次：0 / 0</span>
        <button id="nextBtn" class="btn" disabled>下一頁</button>
      </div>
    </main>
  </div>

  <!-- 燈箱 (Lightbox) -->
  <div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
    <button class="lightbox-btn lightbox-close" onclick="closeLightboxForce()">✕</button>
    <button class="lightbox-btn lightbox-prev" onclick="changeLightboxImage(-1, event)">❮</button>
    
    <div class="lightbox-content" onclick="event.stopPropagation()">
      <div class="lightbox-canvas-container">
        <canvas id="lightboxCanvas"></canvas>
      </div>
      <div id="lightboxTitle" class="lightbox-title">相片名稱</div>
    </div>

    <button class="lightbox-btn lightbox-next" onclick="changeLightboxImage(1, event)">❯</button>
  </div>

<script>
    // ----------------------------------------------------
    // 1. 請填入你的 GitHub 用戶名稱與儲存庫名稱
    // ----------------------------------------------------
    // 例如你的 GitHub 網址是：https://github.com/alex-luk/photo-gallery
    // 則 githubUser 填 'alex-luk'，repoName 填 'photo-gallery'
    const githubUser = 'tamchukchu-ctrl'; // ⚠️ 請替換為你的 GitHub 帳號
    const repoName = 'test1';         // ⚠️ 請替換為你的 Repository 名稱

    let imageFiles = [];
    let currentPage = 1;
    let currentImageIndex = -1;
    const itemsPerPage = 15;

    const folderInput = document.getElementById('folderInput');
    const photoGrid = document.getElementById('photoGrid');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageInfo = document.getElementById('pageInfo');
    const folderTitle = document.getElementById('folderTitle');

    const lightbox = document.getElementById('lightbox');
    const lightboxCanvas = document.getElementById('lightboxCanvas');
    const lightboxTitle = document.getElementById('lightboxTitle');

    // ----------------------------------------------------
    // 2. 網頁開啟時，自動透過 GitHub API 讀取 images 資料夾內的所有檔案
    // ----------------------------------------------------
    window.addEventListener('DOMContentLoaded', async () => {
      folderTitle.textContent = '⏳ 正在從雲端載入相片...';
      
      try {
        // 向 GitHub API 查詢 images 資料夾內容
        const apiUrl = `https://api.github.com/repos/${githubUser}/${repoName}/contents/images`;
        const apiRes = await fetch(apiUrl);
        if (!apiRes.ok) throw new Error('無法讀取 GitHub 資料夾內容，請檢查帳號/專案名稱是否正確');
        
        const filesList = await apiRes.json();

        // 自動過濾出副檔名為 .jpg 或 .jpeg 的相片
        const imageItems = filesList.filter(item => 
          item.type === 'file' && /\.jpe?g$/i.test(item.name)
        );

        if (imageItems.length === 0) {
          folderTitle.textContent = '⚠️ images 資料夾內沒有找到 JPG 相片';
          return;
        }

        // 下載圖片並轉換為 File 物件
        imageFiles = await Promise.all(imageItems.map(async (item) => {
          const response = await fetch(item.download_url);
          const blob = await response.blob();
          return new File([blob], item.name, { type: 'image/jpeg' });
        }));

        folderTitle.textContent = `🖼️ 已自動載入 ${imageFiles.length} 張雲端相片`;
        currentPage = 1;
        renderPage();
      } catch (err) {
        console.error(err);
        folderTitle.textContent = '❌ 相片載入失敗，請確認 GitHub 設定與設定值';
      }
    });

    // 保留手動選擇本機照片作為備用功能
    folderInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      imageFiles = files.filter(file => /\.jpe?g$/i.test(file.name) || file.type === "image/jpeg");
      currentPage = 1;
      
      if (imageFiles.length === 0) {
        alert('請選擇 JPG 格式的相片！');
        return;
      }

      folderTitle.textContent = `📁 已載入本機 ${imageFiles.length} 張相片`;
      renderPage();
    });

    // 渲染 5x3 網格
    function renderPage() {
      photoGrid.innerHTML = '';
      const totalPages = Math.ceil(imageFiles.length / itemsPerPage);
      const startIdx = (currentPage - 1) * itemsPerPage;
      const pageFiles = imageFiles.slice(startIdx, startIdx + itemsPerPage);

      pageFiles.forEach((file, index) => {
        const globalIndex = startIdx + index;
        const card = document.createElement('div');
        card.className = 'photo-card';
        card.onclick = () => openLightbox(globalIndex);
        
        const canvasWrapper = document.createElement('div');
        canvasWrapper.className = 'canvas-wrapper';

        const canvas = document.createElement('canvas');
        canvasWrapper.appendChild(canvas);
        card.appendChild(canvasWrapper);

        const titleEl = document.createElement('div');
        titleEl.className = 'photo-title';
        titleEl.textContent = file.name;
        card.appendChild(titleEl);

        photoGrid.appendChild(card);

        drawImageWithWatermark(file, canvas, true);
      });

      pageInfo.textContent = `頁次：${currentPage} / ${totalPages}（共 ${imageFiles.length} 張）`;
      prevBtn.disabled = currentPage === 1;
      nextBtn.disabled = currentPage === totalPages || totalPages === 0;
    }

    // 繪製相片與 COPY 水印
    function drawImageWithWatermark(file, canvas, isCrop16to9 = true) {
      const img = new Image();
      const url = URL.createObjectURL(file);

      img.onload = () => {
        const ctx = canvas.getContext('2d');

        if (isCrop16to9) {
          canvas.width = 1280;
          canvas.height = 720;
          const scale = Math.max(canvas.width / img.width, canvas.height / img.height);
          const x = (canvas.width / 2) - (img.width / 2) * scale;
          const y = (canvas.height / 2) - (img.height / 2) * scale;
          ctx.drawImage(img, x, y, img.width * scale, img.height * scale);
        } else {
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
        }

        // 水印
        const fontSize = Math.max(canvas.width, canvas.height) * 0.18;
        ctx.font = `bold ${fontSize}px sans-serif`;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.25)';
        ctx.lineWidth = Math.max(3, fontSize * 0.03);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate(-Math.PI / 6);
        ctx.strokeText('COPY', 0, 0);
        ctx.fillText('COPY', 0, 0);
        ctx.restore();

        URL.revokeObjectURL(url);
      };

      img.src = url;
    }

    /* 燈箱控制 */
    function openLightbox(index) {
      if (index < 0 || index >= imageFiles.length) return;
      currentImageIndex = index;
      const file = imageFiles[currentImageIndex];

      lightboxTitle.textContent = `${file.name} (${currentImageIndex + 1} / ${imageFiles.length})`;
      drawImageWithWatermark(file, lightboxCanvas, false);
      lightbox.classList.add('active');
    }

    function closeLightbox(e) {
      if (e.target === lightbox) lightbox.classList.remove('active');
    }

    function closeLightboxForce() {
      lightbox.classList.remove('active');
    }

    function changeLightboxImage(step, e) {
      if (e) e.stopPropagation();
      const newIndex = currentImageIndex + step;
      if (newIndex >= 0 && newIndex < imageFiles.length) {
        openLightbox(newIndex);
      }
    }

    // 分頁控制
    prevBtn.addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderPage(); } });
    nextBtn.addEventListener('click', () => {
      const totalPages = Math.ceil(imageFiles.length / itemsPerPage);
      if (currentPage < totalPages) { currentPage++; renderPage(); }
    });

    document.addEventListener('contextmenu', e => e.preventDefault());
  </script>
</body>
</html>
